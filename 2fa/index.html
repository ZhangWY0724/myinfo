<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
    <title>2FA 验证码</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1rem;
            background: #f4f6fa;
            color: #182338;
            font: 1rem/1.6 system-ui, sans-serif;
        }
        main {
            width: min(100%, 28rem);
            padding: clamp(1.25rem, 5vw, 2rem);
            border: 1px solid #dae1ed;
            border-radius: 1rem;
            background: white;
        }
        h1 { margin: 0; font-size: 1.6rem; }
        p { margin: 0.35rem 0 0; }
        .hint { color: #505e74; font-size: 0.875rem; }
        label { display: block; margin-top: 1.5rem; font-weight: 600; }
        input, button { font: inherit; border-radius: 0.5rem; }
        input {
            width: 100%;
            margin-top: 0.35rem;
            padding: 0.65rem 0.75rem;
            border: 1px solid #a6b2c5;
            color: inherit;
        }
        :focus-visible { outline: 2px solid #245cbb; outline-offset: 3px; }
        .result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-top: 1rem;
            padding: 0.85rem 1rem;
            background: #f0f4fb;
            border-radius: 0.65rem;
        }
        #code {
            padding: 0.1rem 0;
            border: 0;
            background: transparent;
            color: #204fa0;
            font: 700 clamp(1.25rem, 6vw, 2.2rem)/1.4 ui-monospace, monospace;
            letter-spacing: 0.06em;
            cursor: copy;
            transition: transform 120ms ease, color 120ms ease, background-color 120ms ease;
        }
        #code:enabled:hover { color: #163877; }
        #code:enabled:active { transform: scale(0.94); }
        #code.copied:enabled { color: #17643c; background: #dff3e8; }
        #code:disabled { color: #505e74; cursor: default; }
        @media (prefers-reduced-motion: reduce) {
            #code { transition: none; }
            #code:enabled:active { transform: none; background: #d9e1ee; }
        }
        .timer {
            --progress: 0%;
            display: grid;
            place-items: center;
            flex: 0 0 3.25rem;
            aspect-ratio: 1;
            border-radius: 50%;
            background: conic-gradient(#204fa0 var(--progress), #d9e1ee 0);
        }
        #remaining {
            display: grid;
            place-items: center;
            width: calc(100% - 0.4rem);
            aspect-ratio: 1;
            border-radius: 50%;
            background: #f0f4fb;
            color: #505e74;
            font: 600 0.8rem/1 system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
        }
        #status { min-height: 1.6em; }
    </style>
</head>
<body>
    <main>
        <h1>2FA 验证码</h1>
        <p class="hint">在浏览器本地生成，密钥不上传、不保存。</p>

        <label for="secret">2FA 密钥</label>
        <input id="secret" type="password" placeholder="粘贴 Base32 密钥或 otpauth 链接"
            autocomplete="off" spellcheck="false" autocapitalize="off">
        <div class="result">
            <button id="code" type="button" title="点击验证码复制" aria-label="等待生成验证码" disabled>—</button>
            <div id="timer" class="timer"><span id="remaining" role="timer">—</span></div>
        </div>
        <p id="status" class="hint" role="status"></p>
    </main>

    <script>
        'use strict';

        const input = document.querySelector('#secret');
        const code = document.querySelector('#code');
        const timer = document.querySelector('#timer');
        const remaining = document.querySelector('#remaining');
        const status = document.querySelector('#status');
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        const hashes = new Map([['SHA1', 'SHA-1'], ['SHA256', 'SHA-256'], ['SHA512', 'SHA-512']]);
        let current = null;
        let copiedTimeout;

        function clearCopyFeedback() {
            clearTimeout(copiedTimeout);
            code.classList.remove('copied');
        }

        function decodeBase32(value) {
            const normalized = value.replace(/\s/g, '').toUpperCase();
            const match = /^([A-Z2-7]+)(=*)$/.exec(normalized);
            const padding = match && new Map([[0, 0], [2, 6], [4, 4], [5, 3], [7, 1]]).get(match[1].length % 8);
            if (!match || padding === undefined || (match[2] && match[2].length !== padding)) {
                throw new Error('请输入有效的 Base32 密钥。');
            }

            const bytes = [];
            let buffer = 0;
            let bits = 0;
            for (const character of match[1]) {
                buffer = (buffer << 5) | alphabet.indexOf(character);
                bits += 5;
                if (bits >= 8) {
                    bits -= 8;
                    bytes.push(buffer >> bits);
                    buffer &= (1 << bits) - 1;
                }
            }
            if (buffer !== 0) throw new Error('请输入有效的 Base32 密钥。');
            return new Uint8Array(bytes);
        }

        function parseSecret(value) {
            let params = new URLSearchParams();
            if (/^otpauth:/i.test(value)) {
                if (!/^otpauth:\/\/totp\//i.test(value)) {
                    throw new Error('请输入 otpauth://totp/ 格式的链接。');
                }
                params = new URL(value).searchParams;
                value = params.get('secret') ?? '';
            }
            const hash = hashes.get((params.get('algorithm') ?? 'SHA1').toUpperCase());
            const digits = Number(params.get('digits') ?? '6');
            const period = Number(params.get('period') ?? '30');
            if (!hash || ![6, 8].includes(digits) || !Number.isSafeInteger(period) || period < 1) {
                throw new Error('链接中的算法、位数或刷新周期无效。');
            }
            return { bytes: decodeBase32(value), hash, digits, period };
        }

        async function generate(key, counter, digits) {
            const message = new DataView(new ArrayBuffer(8));
            message.setBigUint64(0, BigInt(counter));
            const signature = new DataView(await crypto.subtle.sign('HMAC', key, message));
            const offset = signature.getUint8(signature.byteLength - 1) & 15;
            const number = signature.getUint32(offset) & 0x7fffffff;
            return String(number % 10 ** digits).padStart(digits, '0');
        }

        function timeStep(period) {
            return Math.floor(Date.now() / 1000 / period);
        }

        async function refresh() {
            const state = current;
            if (!state) return;

            const seconds = Date.now() / 1000;
            const step = Math.floor(seconds / state.period);
            const left = state.period - seconds % state.period;
            remaining.textContent = Math.ceil(left) + ' 秒';
            timer.style.setProperty('--progress', (left / state.period * 100) + '%');
            if (state.step === step) return;

            state.step = step;
            clearCopyFeedback();
            code.textContent = '—';
            code.disabled = true;
            code.setAttribute('aria-label', '等待生成验证码');
            status.textContent = '';
            try {
                const value = await generate(await state.key, step, state.digits);
                if (current !== state || timeStep(state.period) !== step) return;
                code.textContent = value;
                code.setAttribute('aria-label', '复制验证码 ' + value);
                code.disabled = false;
            } catch {
                if (current === state) status.textContent = '无法生成验证码，请确认浏览器支持 Web Crypto。';
            }
        }

        function update() {
            current = null;
            clearCopyFeedback();
            code.textContent = '—';
            code.disabled = true;
            code.setAttribute('aria-label', '等待生成验证码');
            status.textContent = '';
            remaining.textContent = '—';
            timer.style.removeProperty('--progress');
            const value = input.value.trim();
            if (!value) return;
            if (!globalThis.crypto?.subtle) {
                status.textContent = '请通过 HTTPS 或 localhost 打开此页面。';
                return;
            }
            try {
                const { bytes, hash, digits, period } = parseSecret(value);
                const key = crypto.subtle.importKey('raw', bytes, { name: 'HMAC', hash }, false, ['sign']);
                current = { key, digits, period, step: null };
                void refresh();
            } catch (error) {
                status.textContent = error.message;
            }
        }

        input.addEventListener('input', update);
        code.addEventListener('click', async () => {
            const state = current;
            if (!state || code.disabled) return;
            const step = state.step;
            if (step !== timeStep(state.period)) {
                void refresh();
                return;
            }
            const value = code.textContent;
            try {
                await navigator.clipboard.writeText(value);
                if (current !== state || state.step !== step || timeStep(state.period) !== step) return;
                clearCopyFeedback();
                code.classList.add('copied');
                copiedTimeout = setTimeout(clearCopyFeedback, 750);
                status.textContent = '已复制验证码。';
            } catch {
                if (current !== state || state.step !== step || timeStep(state.period) !== step) return;
                const selection = window.getSelection();
                if (selection) {
                    const range = document.createRange();
                    range.selectNodeContents(code);
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
                status.textContent = '无法自动复制，请手动复制验证码。';
            }
        });

        const fragment = new URLSearchParams(location.hash.slice(1));
        const prefill = fragment.get('secret') ?? fragment.get('otpauth');
        if (prefill !== null) {
            history.replaceState(null, '', location.pathname + location.search);
            input.value = prefill;
        }
        update();
        setInterval(refresh, 250);
        document.addEventListener('visibilitychange', refresh);
    </script>
</body>
</html>
